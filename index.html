<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>शुभ दीपावली — महावीर शृंगी</title><style>*{box-sizing:border-box}body{margin:0;background:#070819;color:white;font-family:system-ui,sans-serif}main{height:100dvh;min-height:520px;position:relative;overflow:hidden;background:radial-gradient(ellipse at bottom,#38204b,#08091d 70%);touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}.top{position:absolute;top:7%;width:100%;text-align:center;pointer-events:none}.top small{letter-spacing:3px;color:#ffd989}.top h1{font-size:clamp(36px,10vw,62px);margin:10px 0;color:#ffe7a5;text-shadow:0 0 24px #f89b34}.top p{color:#f5d9bd}.message{position:absolute;top:49%;width:100%;text-align:center;font-size:clamp(27px,8vw,48px);font-weight:900;color:#fff1b0;text-shadow:0 0 24px orange;opacity:0;transition:opacity .25s;pointer-events:none}.footer{position:absolute;bottom:92px;text-align:center;width:100%;color:#ffe0a4;font-weight:700;pointer-events:none}.controls{position:absolute;bottom:22px;width:100%;display:flex;justify-content:center;gap:9px;padding:0 8px}button{border:1px solid #9b79ad;border-radius:25px;padding:12px 15px;background:#43305c;color:white;font-weight:700;font-size:14px}button:first-child{background:#ffd16e;color:#35220a;border:0}</style></head><body><main id="stage"><canvas id="sky"></canvas><div class="top"><small>✦ FESTIVAL OF LIGHTS ✦</small><h1>शुभ दीपावली</h1><p>आसमान में कहीं भी उँगली लगाएँ ✨</p></div><div class="message" id="message">🎆 HAPPY DIWALI! 🎆</div><div class="footer">महावीर शृंगी की ओर से हार्दिक शुभकामनाएँ 🪔</div><div class="controls"><button id="big">🎆 बड़ा धमाका</button><button id="auto">▶ ऑटो शो</button><button id="mute">🔊 आवाज़</button></div></main><script>
const stage=document.getElementById('stage'),c=document.getElementById('sky'),ctx=c.getContext('2d'),msg=document.getElementById('message');let w,h,parts=[],ac=null,muted=false,automatic=null,lastVoice=0,hideMsg;const palette=['#ffdd72','#ff6b9b','#78eaff','#b5ff92','#c9a0ff','#ffffff','#ff9d59'];function resize(){let r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;c.width=w*d;c.height=h*d;ctx.setTransform(d,0,0,d,0,0)}new ResizeObserver(resize).observe(stage);resize();function pop(){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();let t=ac.currentTime,len=Math.floor(ac.sampleRate*.3),b=ac.createBuffer(1,len,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*Math.exp(-i/(len*.16));let s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();f.type='lowpass';f.frequency.setValueAtTime(2800,t);f.frequency.exponentialRampToValueAtTime(250,t+.28);s.buffer=b;s.connect(f);f.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.29);s.start(t);s.stop(t+.3)}catch(e){}}function burst(x,y,big=false,voice=true){let n=big?135:75,base=palette[Math.floor(Math.random()*palette.length)];for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=(big?2:1.2)+Math.random()*(big?5:3.5);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:.009+Math.random()*.013,color:Math.random()<.3?palette[Math.floor(Math.random()*palette.length)]:base,size:1+Math.random()*2.4})}pop();if(voice){msg.style.opacity='1';clearTimeout(hideMsg);hideMsg=setTimeout(()=>msg.style.opacity='0',1350)}}function draw(){ctx.fillStyle='rgba(7,8,25,.22)';ctx.fillRect(0,0,w,h);for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.vx*=.991;p.life-=p.decay;if(p.life<=0){parts.splice(i,1);continue}ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=13;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;requestAnimationFrame(draw)}draw();c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect();burst(e.clientX-r.left,e.clientY-r.top)});document.getElementById('big').onclick=()=>{burst(w*.5,h*.45,true);setTimeout(()=>burst(w*.25,h*.3,true,false),180);setTimeout(()=>burst(w*.75,h*.33,true,false),380)};document.getElementById('auto').onclick=e=>{if(automatic){clearInterval(automatic);automatic=null;e.target.textContent='▶ ऑटो शो'}else{burst(w*.5,h*.4,true);automatic=setInterval(()=>burst(w*(.15+Math.random()*.7),h*(.2+Math.random()*.45),Math.random()>.5),1100);e.target.textContent='■ रोकें'}};document.getElementById('mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇 बंद':'🔊 आवाज़';};
</script></body></html>
